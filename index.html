    .cicon { width: 34px; height: 34px; border-radius: 9px; background: rgba(255,255,255,0.08); display: flex; align-items: center; justify-content: center; font-size: 0.95rem; flex-shrink: 0; }
    .cv-box { background: rgba(255,255,255,0.05); border: 1.5px solid rgba(255,255,255,0.11); border-radius: 18px; padding: 2rem; text-align: center; }
    .cv-box .cv-icon { font-size: 2.8rem; margin-bottom: 0.9rem; }
    .cv-box h3 { font-size: 1.05rem; font-weight: 700; margin-bottom: 1.2rem; color: white; }
    .cv-box p  { font-size: 0.85rem; color: rgba(255,255,255,0.55); margin-bottom: 1.4rem; }
    .btn-teal { background: linear-gradient(135deg,var(--teal),#0f766e); color: white; border: none; padding: 0.65rem 1.4rem; border-radius: 9px; font-size: 0.88rem; font-weight: 600; cursor: pointer; text-decoration: none; transition: all 0.2s; display: inline-block; }
    .btn-teal:hover { transform: translateY(-2px); box-shadow: 0 8px 20px rgba(13,148,136,0.3); }
    footer { background: #0f172a; border-top: 1px solid rgba(255,255,255,0.05); padding: 1.4rem 2rem; text-align: center; }
    .footer-text { font-size: 0.78rem; color: rgba(255,255,255,0.28); }
    .footer-motto { font-family: 'JetBrains Mono', monospace; font-size: 0.74rem; color: rgba(167,139,250,0.35); border-top: 1px solid rgba(255,255,255,0.05); padding-top: 0.6rem; margin-top: 0.4rem; }
    .author-link,.collab-link,.event-link { color:var(--violet-dark); text-decoration:underline; text-underline-offset:3px; }
    .collab-grid,.interest-grid {display:grid;grid-template-columns:repeat(auto-fit,minmax(240px,1fr));gap:1rem;}
    .collab-card {border:1px solid var(--border);border-radius:12px;padding:1rem;background:var(--bg);}
    .collab-card p,.empty-note {font-size:.83rem;color:var(--slate-soft);}
    .upcoming-block {margin-bottom:2.5rem;}
    .event-status {display:inline-block;color:#0f766e;font-weight:600;font-size:.78rem;margin-top:.3rem;}
    a.course-card {display:block;text-decoration:none;color:inherit;}
    .materials-label {display:block;margin-top:.7rem;font-size:.8rem;color:var(--violet-dark);font-weight:600;}
    .materials-pending {color:var(--slate-soft);font-weight:400;}
    .interest-card {border:1px solid #ffffff25;border-radius:15px;padding:1.2rem;background:#ffffff0b;}
    .interest-card h3 {font-size:1.05rem;margin-bottom:.5rem;}
    .interest-card p {color:#e0e7ff;font-size:.88rem;}
    .interest-photos {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:.6rem;margin-top:1rem;}
    .interest-photos figure {min-width:0;}
    .interest-photos img {width:100%;aspect-ratio:4/3;object-fit:cover;border-radius:9px;display:block;}
    .interest-photos figcaption {font-size:.72rem;color:#e0e7ff;margin-top:.25rem;}
    .photo-placeholder {margin-top:1rem;min-height:110px;display:grid;place-items:center;border:1px dashed #ffffff40;border-radius:10px;color:#c7d2fe;font-size:.8rem;text-align:center;padding:1rem;}
    .blog-card {border:1px solid var(--border);background:white;border-radius:14px;padding:1.4rem;margin-bottom:1rem;}
    .blog-card h3 {font-family:'Playfair Display',serif;font-size:1.25rem;margin:.4rem 0;}
    .blog-card p {margin:.7rem 0;color:var(--slate-mid);white-space:pre-wrap;}
    .blog-card summary {cursor:pointer;color:var(--violet-dark);font-weight:600;margin-top:1rem;}
    a:focus-visible,button:focus-visible,summary:focus-visible {outline:3px solid var(--teal);outline-offset:3px;}
    .talk-item.upcoming { background: linear-gradient(135deg, rgba(13,148,136,0.07) 0%, rgba(94,234,212,0.04) 100%); border: 1.5px solid rgba(13,148,136,0.3); border-radius: 12px; padding: 1rem 1rem 1rem 1.75rem; margin-bottom: 1.75rem; }
    .talk-item.upcoming::before { background: var(--teal); box-shadow: 0 0 0 2px var(--teal-light); border-color: white; }
    .talk-item.upcoming .talk-meta { color: var(--teal); }
    .research-category { margin-bottom: 2.5rem; }
    .research-cat-title { font-family: 'Playfair Display', serif; font-size: 1.15rem; font-weight: 700; color: var(--slate); margin-bottom: 1rem; padding-bottom: 0.4rem; border-bottom: 2px solid var(--border); display: flex; align-items: center; gap: 0.5rem; }
    .lang-toggle { position: fixed; bottom: 1.5rem; right: 1.5rem; z-index: 999; background: var(--violet); color: white; border: none; border-radius: 999px; padding: 0.55rem 1rem; font-size: 0.82rem; font-weight: 700; font-family: 'Inter', sans-serif; cursor: pointer; box-shadow: 0 4px 16px rgba(124,58,237,0.35); transition: all 0.2s; letter-spacing: 0.03em; }
    .lang-toggle:hover { background: var(--violet-dark); transform: translateY(-2px); box-shadow: 0 8px 20px rgba(124,58,237,0.4); }
    .hero-photo { width:clamp(130px,18vw,220px); aspect-ratio:1; height:auto; object-fit:cover; object-position:top center; border-radius:16px; border:2px solid rgba(255,255,255,0.18); box-shadow:0 20px 50px rgba(0,0,0,0.35); flex-shrink:0; }
    @media (max-width: 720px) {
      .hero-inner { flex-direction: column; text-align: center; }
      .hero-links { justify-content: center; }
      #hero-summary { margin: 0 auto 1.2rem; }
      .contact-grid, .mas-layout { grid-template-columns: 1fr; }
      .hero-text h1 { font-size: clamp(1.4rem, 6vw, 1.9rem); }
      #trefoil-main { width: 125px; }
      .hero-photo { width: 130px; height: 130px; }
    }
    [hidden] { display:none !important; }
    .hero-text,.pub-content,.fi-body {min-width:0;overflow-wrap:anywhere;}
    .tab-panel {overflow-wrap:anywhere;}
    #load-error {color:#9f1239;margin-bottom:1rem;}
    @media(max-width:720px){
      #hero {padding:2rem 1rem;}
      .hero-inner {gap:1.2rem;}
      .sec {padding:2rem 1rem;}
      .tab-bar {scrollbar-width:thin;}
      .tab-bar::-webkit-scrollbar {display:block;height:4px;}
      .formation-item {gap:.7rem;}
      .fi-year {width:70px;}
      .pub-item {padding:1rem;gap:.7rem;}
      .thesis-grid,.research-grid,.courses-grid,.students-grid,.div-grid,.collab-grid,.interest-grid {grid-template-columns:repeat(auto-fit,minmax(min(100%,240px),1fr));}
    }

    /* Research: scoped academic layout */
    #tab-investigacion .research-section {margin-bottom:2.5rem;}
    #tab-investigacion .research-heading {font-family:'Playfair Display',serif;font-size:1.25rem;line-height:1.35;border-bottom:1px solid var(--border);padding-bottom:.65rem;margin-bottom:1rem;}
    .research-intro {max-width:800px;color:var(--slate-mid);font-size:.95rem;line-height:1.8;}
    .research-intro p+p {margin-top:.75rem;}
    .research-keywords {display:flex;flex-wrap:wrap;gap:.45rem;margin-top:1.1rem;}
    .research-keywords span {font-size:.75rem;font-weight:600;color:var(--violet-dark);background:#ede9fe;border:1px solid #ddd6fe;border-radius:999px;padding:.22rem .7rem;}
    .research-lines {display:grid;gap:.85rem;}
    .research-line {display:grid;grid-template-columns:116px minmax(0,1fr);gap:1.2rem;align-items:center;background:white;border:1px solid var(--border);border-radius:14px;padding:1.2rem 1.4rem;}
    .research-diagram {background:#f8fafc;border-radius:10px;padding:.4rem;}
    .research-diagram svg {width:100%;display:block;}
    #tab-investigacion h4 {font-size:1rem;line-height:1.45;margin-bottom:.35rem;}
    .research-line p,.research-record p,.research-other p {font-size:.875rem;color:var(--slate-mid);line-height:1.7}
    .research-related-list {margin-top:.65rem;display:flex;flex-direction:column;align-items:flex-start;gap:.2rem;font-size:.78rem;}
    .research-related-list span {color:var(--slate-soft);font-weight:600;}
    .research-related {color:var(--violet-dark);text-underline-offset:3px)}
    .research-other {display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:0 1.5rem;}
    .research-other article {padding:.8rem 0;border-bottom:1px solid var(--border);}
    .research-status {display:inline-block;color:var(--slate-soft);font-size:.75rem;font-weight:600;margin-top:.3rem;}
    .research-record {display:grid;grid-template-columns:155px minmax(0,1fr);gap:1rem;padding:1rem 0;border-bottom:1px solid var(--border);}
    .research-record:last-child {border-bottom:0;}
    .research-period {font-size:.78rem;color:var(--violet-dark);font-weight:600;padding-top:.15rem;}
    .research-meta {font-size:.8rem;color:#0f766e;font-weight:600;margin-bottom:.4rem;}
    .research-record .research-leads {font-size:.78rem;color:var(--slate-soft);margin-top:.45rem;}
    @media(max-width:560px){.research-line{grid-template-columns:64px minmax(0,1fr);gap:.75rem;padding:1rem;align-items:start;}.research-other{grid-template-columns:1fr;}.research-record{grid-template-columns:1fr;gap:.25rem;}}
  
    #pub-list {gap:1.8rem;}
    .pub-group {display:grid;gap:.9rem;min-width:0;}
    .pub-group h3.pub-group-heading {font-family:'Playfair Display',serif;font-size:1.25rem;border-bottom:1px solid var(--border);padding-bottom:.55rem;}
    .pub-content {flex:1;min-width:0;overflow-wrap:anywhere;}
    .pub-extra {font-size:.85rem;color:var(--slate-mid);margin-top:.6rem;}
    .pub-extra summary {cursor:pointer;color:var(--violet-dark);font-weight:600;}
    .pub-extra p {margin-top:.5rem;}
